name: hermes-stack

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
      args:
        PNPM_VERSION: "11.21.0"
        PLAYWRIGHT_VERSION: "1.62.1"
        OPEN_DESIGN_REV: "0c237048cb078f95ab01c416924dcb255f7d5dfd"
    image: local/hermes-agent-dev:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:9119:9119"
      - "127.0.0.1:7456:7456"
    volumes:
      - ~/.hermes:/opt/data
      - ${HOME}/.config/hermes-stack/open-design:/opt/open-design-data
    environment:
      HERMES_HOME: "/opt/data"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_FILES_ROOT: "/workspace"
      HERMES_WRITE_SAFE_ROOT: "/workspace:/opt/data"
      TERMINAL_CWD: "/workspace"
      OD_BIND_HOST: "0.0.0.0"
      OD_PORT: "7456"
      OD_WEB_PORT: "7456"
      OD_DISABLE_API_AUTH: "1"
      OD_DATA_DIR: "/opt/open-design-data"
      OD_ALLOWED_ORIGINS: "${OPEN_DESIGN_ALLOWED_ORIGINS:-}"
    working_dir: "/workspace"
    ipc: host
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; [urllib.request.urlopen(url, timeout=3) for url in ('http://127.0.0.1:9119/api/health', 'http://127.0.0.1:7456/api/health')]"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tailscale:
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: hermes-stack-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-hermes-stack}
    restart: unless-stopped
    entrypoint: ["/config/entrypoint.sh"]
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_KUBE_SECRET: ""
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${HOME}/.config/hermes-stack/tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro

  tailscale-proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: hermes-stack-tailscale-proxy
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      hermes:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
